<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!--
      A stand-in for a static Storybook build, for the reader's browser tests (whole-component.test.mjs).
      It draws each story with plain DOM code. The React stories also leave what the reader looks for
      in React's internals: a fiber tree on #storybook-root, and the story's component, argTypes and
      initial args on window.__STORYBOOK_PREVIEW__, as Storybook's React renderer does.
    -->
    <style>
      body { margin: 0; font-family: sans-serif; font-size: 14px; line-height: 20px; color: rgb(17, 17, 17); }
      #storybook-root { padding: 16px; }
      button { font: inherit; color: inherit; background: rgb(255, 255, 255); border: 1px solid rgb(204, 204, 204); padding: 8px 16px; margin: 0; }
      input::placeholder { color: rgb(136, 136, 136); }
      input:focus { outline: none; border-color: rgb(0, 0, 255) !important; }
    </style>
  </head>
  <body>
    <div id="storybook-root"></div>
    <script>
      const params = new URLSearchParams(location.search);
      const id = params.get("id");
      const args = {};
      for (const pair of (params.get("args") || "").split(";").filter(Boolean)) {
        const at = pair.indexOf(":");
        const value = pair.slice(at + 1);
        args[pair.slice(0, at)] = value === "!true" ? true : value === "!false" ? false : value.replace(/\+/g, " ");
      }
      const root = document.getElementById("storybook-root");

      /** An element with inline styles and children. */
      function h(tag, style, ...children) {
        const element = document.createElement(tag);
        if (style) element.style.cssText = style;
        for (const child of children) element.append(child);
        return element;
      }

      // The parts of React's fiber tree that the reader walks.
      const fiber = (props) => Object.assign({ tag: 0, child: null, sibling: null, return: null, elementType: null, type: null, stateNode: null }, props);
      function link(parent, children) {
        children.forEach((child, i) => {
          child.return = parent;
          if (i > 0) children[i - 1].sibling = child;
        });
        parent.child = children[0] || null;
        return parent;
      }
      const host = (element, children = []) => link(fiber({ tag: 5, stateNode: element, elementType: element.tagName.toLowerCase() }), children);
      const portal = (children) => link(fiber({ tag: 4, stateNode: { containerInfo: document.body } }), children);
      const component = (type, children) => link(fiber({ tag: 0, elementType: type, type }), children);
      const fiberRoot = {};
      /** Puts a new current tree on the root, as a React commit does. The container keeps its first fiber. */
      function commit(children, story) {
        fiberRoot.current = link(fiber({ tag: 3, stateNode: fiberRoot }), [component(function StorybookWrapper() {}, children)]);
        if (!root.__reactContainer$fixture) root.__reactContainer$fixture = fiber({ tag: 3, stateNode: fiberRoot });
        window.__STORYBOOK_PREVIEW__ = { currentRender: { story } };
      }

      const stories = {
        // A month of 42 day buttons, eight levels down, under a navigation bar placed over the caption.
        "fixture-calendar--default"() {
          const weeks = [];
          for (let week = 0; week < 6; week++) {
            const days = [];
            for (let day = 0; day < 7; day++) {
              const date = new Date(2026, 8, 28 + week * 7 + day).getDate();
              days.push(h("td", "padding: 0", h("button", "width: 32px; height: 32px; padding: 0; border: 0", String(date))));
            }
            weeks.push(h("tr", "", ...days));
          }
          const nav = h("nav", "position: absolute; top: 0; left: 0; right: 0; height: 28px; display: flex; justify-content: space-between", h("button", "padding: 0 8px", "<"), h("button", "padding: 0 8px", ">"));
          const month = h("div", "", h("div", "height: 28px; text-align: center", "October 2026"), h("table", "border-collapse: collapse", h("tbody", "", ...weeks)));
          root.append(h("div", "display: inline-block; padding: 12px; border: 1px solid rgb(204, 204, 204)", h("div", "position: relative; display: flex; flex-direction: column", nav, month)));
        },

        // Far more elements than a component draws.
        "fixture-crowded--default"() {
          const cells = [];
          for (let i = 0; i < 3000; i++) cells.push(h("div", "width: 4px; height: 4px; background: rgb(200, 0, 0)"));
          root.append(h("div", "display: flex; flex-wrap: wrap; width: 400px", ...cells));
        },

        // Text the browser draws from an input's value or placeholder.
        "fixture-field--default"() {
          const input = (attributes) => Object.assign(h("input", "display: flex; height: 36px; width: 200px; box-sizing: border-box; padding: 4px 12px; border: 1px solid rgb(204, 204, 204); font: inherit; color: rgb(17, 17, 17)"), attributes);
          root.append(h("div", "display: flex; flex-direction: column; gap: 8px; width: 200px", input({ placeholder: "Enter text..." }), input({ value: "Pedro Duarte" })));
        },

        // Drawn closed. A click on the trigger opens content in a portal outside the story root.
        "fixture-popover--default"() {
          function Popover() {}
          const trigger = h("button", "", "Open popover");
          Object.assign(trigger.dataset, { state: "closed" });
          trigger.setAttribute("aria-haspopup", "dialog");
          trigger.setAttribute("aria-expanded", "false");
          // Content a closed overlay keeps out of the document, as Radix Select does.
          const detached = h("div", "", "Not drawn");
          const story = { component: Popover, argTypes: {}, initialArgs: {} };
          root.append(trigger);
          commit([component(Popover, [host(trigger), portal([host(detached)])])], story);
          trigger.addEventListener("click", () => {
            const box = trigger.getBoundingClientRect();
            // The panel sits 4px below its positioned wrapper, as Radix's popper content does with translate-y-1.
            const content = h(
              "div",
              `position: fixed; left: ${box.left}px; top: ${box.bottom + 8}px; width: 274px`,
              h(
                "div",
                "transform: translateY(4px); padding: 16px; background: rgb(255, 255, 255); border: 1px solid rgb(204, 204, 204)",
                h("h4", "margin: 0", "Dimensions"),
                h("p", "margin: 8px 0 0", "Set the dimensions for the layer."),
                h("input", "display: block; margin-top: 8px; width: 200px; border: 1px solid rgb(204, 204, 204)"),
              ),
            );
            document.body.append(content);
            // An overlay moves focus into its content when it opens, as Radix does.
            content.querySelector("input").focus();
            trigger.setAttribute("aria-expanded", "true");
            trigger.dataset.state = "open";
            commit([component(Popover, [host(trigger), portal([host(content)])])], story);
          });
        },

        // Opens only from its defaultOpen arg: the trigger has no click handler. Modal, with a backdrop.
        "fixture-dialog--default"() {
          function Dialog() {}
          const trigger = h("button", "", "Open dialog");
          trigger.setAttribute("aria-haspopup", "dialog");
          trigger.setAttribute("aria-expanded", "false");
          root.append(trigger);
          const story = { component: Dialog, argTypes: { defaultOpen: { name: "defaultOpen", type: { name: "boolean" } } }, initialArgs: {} };
          const parts = [host(trigger)];
          if (args.defaultOpen === true) {
            const backdrop = h("div", "position: fixed; inset: 0; background: rgba(0, 0, 0, 0.8)");
            const content = h(
              "div",
              "position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 300px; padding: 24px; box-sizing: border-box; background: rgb(255, 255, 255)",
              h("h2", "margin: 0; font-size: 18px", "Edit profile"),
              h("p", "margin: 8px 0 0", "Make changes to your profile here."),
            );
            document.body.append(backdrop, content);
            trigger.setAttribute("aria-expanded", "true");
            parts.push(portal([host(backdrop), host(content)]));
          }
          commit([component(Dialog, parts)], story);
        },

        // A story decorator wraps the component in a padded box, beside some page content.
        "fixture-panel--default"() {
          function Decorator() {}
          function Panel() {}
          const label = typeof args.children === "string" ? args.children : "Panel body";
          const panel = h("div", "padding: 12px; border: 1px solid rgb(204, 204, 204); width: 160px", label);
          const main = h("div", "padding: 8px", "Main content");
          const wrapper = h("div", "display: flex; gap: 24px; padding: 40px; background: rgb(238, 238, 238)", panel, main);
          root.append(wrapper);
          // The story's children arg is markup, which a URL cannot carry.
          const story = { component: Panel, argTypes: { children: { name: "children" } }, initialArgs: { children: { $$typeof: "react.element" } } };
          commit([component(Decorator, [host(wrapper, [component(Panel, [host(panel)]), host(main)])])], story);
        },

        // A command item: an icon with a right margin, its label, and a shortcut pushed to the right edge by an auto margin.
        "fixture-row--default"() {
          const row = h("div", "display: flex; align-items: center; width: 300px; padding: 6px 8px; box-sizing: border-box");
          row.insertAdjacentHTML("beforeend", '<svg width="16" height="16" viewBox="0 0 16 16" style="margin-right: 8px; opacity: 0.5"><circle cx="8" cy="8" r="6" fill="currentColor"/></svg>');
          row.append(h("span", "", "Profile"), h("span", "margin-left: auto; font-size: 12px", "⌘P"));
          root.append(row);
        },

        // A ring drawn as one svg, with a gradient in its defs. A style sheet gives the circle no fill
        // and its stroke width, and one stop's colour is a var(), as Meridian's PrimaRing does.
        "fixture-ring--default"() {
          const sheet = document.createElement("style");
          sheet.textContent = ".ring { fill: none; stroke-width: 3px; }";
          document.head.append(sheet);
          root.insertAdjacentHTML(
            "beforeend",
            '<svg width="32" height="32" viewBox="0 0 32 32" style="display: block"><defs><linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--ring-core, #4a5ae8)"/><stop offset="1" stop-color="#a855f7"/></linearGradient></defs><circle class="ring" cx="16" cy="16" r="14" stroke="url(#ring)"/></svg>',
          );
        },

        // A modal's column: a footer that stretches across it, with a line of text that grows and is cut
        // with an ellipsis, and a button. Under it a box that does not stretch and a box 100% wide.
        "fixture-footer--default"() {
          const note = h("p", "flex: 1 1 0%; min-width: 0; margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap", "Choose cards or sections to attach this file to");
          const footer = h("footer", "display: flex; align-items: center; gap: 8px; padding: 12px 16px", note, h("button", "", "Attach"));
          const narrow = h("div", "align-self: flex-start; padding: 4px", "Narrow");
          const full = h("div", "width: 100%", "Full");
          root.append(h("div", "display: flex; flex-direction: column; width: 320px", footer, narrow, full));
        },

        // What process-pack #85 reads: box shadows, background gradients, filters, a margin on a row's
        // cross axis, and an svg attribute that a style sheet overrides.
        "fixture-gaps--default"() {
          const sheet = document.createElement("style");
          sheet.textContent = ":root { --ring-ink: rgb(74, 90, 232); } .thin { stroke-width: 1.5px; } .glow { display: block; filter: drop-shadow(rgba(139, 92, 246, 0.3) 0px 0px 6px); }";
          document.head.append(sheet);
          // Tailwind's shadow list: two transparent placeholders, an inset ring in a token's colour, and two soft shadows.
          const card = h("div", "width: 200px; height: 60px; background: rgb(255, 255, 255); border-radius: 8px; box-shadow: 0 0 #0000, 0 0 #0000, inset 0 0 0 1px var(--ring-ink), 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1)");
          // A gradient border, as AnswerNudgeCard draws it: a white layer on the padding box over a gradient on the border box.
          const nudge = h("div", "width: 200px; height: 60px; box-sizing: border-box; border: 1px solid transparent; border-radius: 12px; background: linear-gradient(rgb(255, 255, 255), rgb(255, 255, 255)) padding-box, linear-gradient(135deg, rgb(59, 75, 212) 0%, rgb(124, 58, 237) 50%, rgb(139, 111, 232) 100%) border-box");
          // A dot drawn with a radial gradient, and a box whose background is an image.
          const dot = h("div", "width: 40px; height: 20px; background-image: radial-gradient(circle at 25% 50%, rgb(16, 185, 129) 0%, rgb(16, 185, 129) 40%, transparent 41%)");
          const picture = h("div", "width: 20px; height: 20px; background-image: url(data:image/gif;base64,R0lGODlhAQABAAAAACw=)");
          // Filters: a glow on an svg, as PrimaRing's, and two filters Klaus does not draw.
          const glow = h("div", "");
          glow.insertAdjacentHTML("beforeend", '<svg class="glow" width="20" height="20" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="rgb(124, 58, 237)"/></svg>');
          const blurred = h("div", "width: 20px; height: 20px; background: rgb(0, 0, 0); filter: blur(2px) grayscale(1)");
          // A checkbox 2px below the top of its row, as AttachFileToCardsModal's.
          const row = h("label", "display: flex; align-items: flex-start; gap: 12px; width: 200px", h("span", "margin-top: 2px; width: 16px; height: 16px; flex: none; box-sizing: border-box; border: 1px solid rgb(0, 0, 0)"), h("span", "", "Attach to card"));
          // A lucide icon whose stroke-width attribute a style sheet overrides, as Tailwind's stroke-[1.5] does.
          const icon = h("div", "");
          icon.insertAdjacentHTML("beforeend", '<svg class="thin" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: block"><path d="M5 12h14"/></svg>');
          root.append(h("div", "display: flex; flex-direction: column; align-items: flex-start; gap: 16px", card, nudge, dot, picture, glow, blurred, row, icon));
        },
      };
      stories[id]();
    </script>
  </body>
</html>
