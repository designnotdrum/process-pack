<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Klaus: apply a release</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    font: 12px/1.5 Inter, system-ui, sans-serif;
    color: var(--figma-color-text, #1a1a1a);
    background: var(--figma-color-bg, #fff);
  }
  h1 { margin: 0 0 4px; font-size: 14px; font-weight: 600; }
  h2 { margin: 16px 0 4px; font-size: 12px; font-weight: 600; }
  p { margin: 0 0 8px; }
  .hint { color: var(--figma-color-text-secondary, #666); }
  .drop {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin: 12px 0;
    padding: 16px;
    border: 1px dashed var(--figma-color-border, #bbb);
    border-radius: 6px;
  }
  .drop.over { border-color: var(--figma-color-border-selected, #0d99ff); background: var(--figma-color-bg-hover, #f5f5f5); }
  button, .choose {
    display: inline-block;
    padding: 6px 12px;
    font: inherit;
    font-weight: 500;
    color: var(--figma-color-text-onbrand, #fff);
    background: var(--figma-color-bg-brand, #0d99ff);
    border: 0;
    border-radius: 6px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  .choose { color: var(--figma-color-text, #1a1a1a); background: var(--figma-color-bg-secondary, #eee); }
  button:focus-visible, .choose:focus-within { outline: 2px solid var(--figma-color-border-selected, #0d99ff); outline-offset: 2px; }
  .choose input { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .refused, .failed {
    margin: 0 0 8px;
    padding: 8px;
    border-radius: 6px;
    color: var(--figma-color-text-danger, #c0261b);
    background: var(--figma-color-bg-danger-tertiary, #fdecea);
  }
  ul { margin: 0 0 8px; padding: 0; list-style: none; }
  li { padding: 4px 0; border-top: 1px solid var(--figma-color-border, #e5e5e5); }
  .status { display: inline-block; min-width: 64px; margin-right: 6px; font-weight: 600; }
  .status.failed-status { color: var(--figma-color-text-danger, #c0261b); }
  .detail { display: block; color: var(--figma-color-text-secondary, #666); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Klaus: apply a release</h1>
  <p class="hint">Add the Figma data a Klaus run made: the .zip from the CI artifact, or manifest.json with the figma-001.json files next to it. Nothing is sent anywhere.</p>

  <div id="drop" class="drop">
    <label class="choose">Choose files<input id="files" type="file" multiple accept=".zip,.json"></label>
    <span class="hint">or drop them here</span>
  </div>

  <div id="problem" class="refused" role="alert" hidden></div>
  <p id="working" class="hint" role="status" hidden></p>

  <section id="release" hidden aria-labelledby="release-title">
    <h2 id="release-title">Ready to apply</h2>
    <p id="targets"></p>
    <ul id="units"></ul>
    <p id="notes" class="hint"></p>
    <button id="apply" type="button">Apply to this file</button>
  </section>

  <section id="results" hidden aria-labelledby="results-title">
    <h2 id="results-title">Result</h2>
    <p id="tally"></p>
    <ul id="outcomes"></ul>
    <p id="variables"></p>
    <ul id="warnings" class="hint"></ul>
  </section>
</main>
<script>
/**
 * Reads what a person gives the plugin window: a CI artifact as a .zip, or the loose files.
 *
 * This runs in the plugin's window, a browser page, so it uses no Node module. build.mjs copies it
 * into ui.html as it is, minus the word `export`. A zip is read from its central directory, and only
 * the entries the plugin needs are unpacked: manifest.json and the generator's data files. Deflate
 * is unpacked with the browser's DecompressionStream, so the plugin carries no unzip library.
 *
 * The result is text, nothing else. Nothing here parses or runs it. The plugin's main thread reads
 * it with the generator's own reader (data-file.mjs), which is what refuses a file that is not
 * generator data.
 */

class SourceError extends Error {}

/** The most a zip may be, and the most one unpacked entry may be. A data file is under 100,000 characters. */
const MAX_ZIP_BYTES = 200 * 1024 * 1024;
const MAX_ENTRY_BYTES = 1024 * 1024;
const MAX_ENTRIES = 20000;

/** The names the plugin reads. Everything else in an artifact (screenshots, other files) is left alone. */
const WANTED = /(^|\/)(manifest\.json|figma-\d{3,}\.json)$/;
/** Loose files the generator writes that the plugin does not apply, so a whole folder can be added at once. */
const SKIPPED_LOOSE = /^(figma-retention\.json|.*\.png)$/i;

const decoder = new TextDecoder("utf-8", { fatal: true });

/** True when the bytes start like a zip: "PK". */
const looksLikeZip = (bytes) => bytes.length >= 4 && bytes[0] === 0x50 && bytes[1] === 0x4b;

function textOf(bytes, path) {
  let text;
  try {
    text = decoder.decode(bytes);
  } catch {
    throw new SourceError(`${path} is not text, so it is not generator data.`);
  }
  return text.charCodeAt(0) === 0xfeff ? text.slice(1) : text;
}

/** The unpacked bytes of a deflate stream, stopping as soon as they pass the limit. */
async function inflate(bytes, limit, path) {
  if (typeof DecompressionStream === "undefined") {
    throw new SourceError("This version of Figma cannot unzip files here. Unzip the artifact and add manifest.json with the figma-001.json files.");
  }
  const reader = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw")).getReader();
  const chunks = [];
  let total = 0;
  try {
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      total += value.length;
      if (total > limit) {
        await reader.cancel();
        throw new SourceError(`${path} unpacks to more than ${limit / 1024 / 1024} MB, so it is not generator data.`);
      }
      chunks.push(value);
    }
  } catch (error) {
    if (error instanceof SourceError) throw error;
    throw new SourceError(`${path} is damaged inside the zip and could not be unpacked.`);
  }
  const out = new Uint8Array(total);
  let at = 0;
  for (const chunk of chunks) {
    out.set(chunk, at);
    at += chunk.length;
  }
  return out;
}

/**
 * The wanted entries of a zip, as { path, text }. Reads the central directory, so a zip written with
 * data descriptors (as GitHub writes artifacts) works the same as any other.
 */
async function readZip(bytes, label) {
  const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  const broken = () => new SourceError(`${label} is not a zip the plugin can read.`);
  let end = -1;
  for (let at = bytes.length - 22; at >= Math.max(0, bytes.length - 22 - 65535); at--) {
    if (view.getUint32(at, true) === 0x06054b50) {
      end = at;
      break;
    }
  }
  if (end < 0) throw broken();
  const count = view.getUint16(end + 10, true);
  const directoryOffset = view.getUint32(end + 16, true);
  if (count === 0xffff || directoryOffset === 0xffffffff) {
    throw new SourceError(`${label} uses Zip64, which the plugin does not read. Unzip it and add manifest.json with the figma-001.json files.`);
  }
  if (count > MAX_ENTRIES) throw new SourceError(`${label} holds more than ${MAX_ENTRIES} files.`);

  const found = [];
  let at = directoryOffset;
  for (let i = 0; i < count; i++) {
    if (at + 46 > bytes.length || view.getUint32(at, true) !== 0x02014b50) throw broken();
    const flags = view.getUint16(at + 8, true);
    const method = view.getUint16(at + 10, true);
    const packed = view.getUint32(at + 20, true);
    const size = view.getUint32(at + 24, true);
    const nameLength = view.getUint16(at + 28, true);
    const extraLength = view.getUint16(at + 30, true);
    const commentLength = view.getUint16(at + 32, true);
    const local = view.getUint32(at + 42, true);
    if (at + 46 + nameLength > bytes.length) throw broken();
    const path = new TextDecoder("utf-8").decode(bytes.subarray(at + 46, at + 46 + nameLength)).replaceAll("\\", "/");
    at += 46 + nameLength + extraLength + commentLength;
    if (path.endsWith("/") || !WANTED.test(path)) continue;

    if (flags & 1) throw new SourceError(`${path} in ${label} is encrypted.`);
    if (method !== 0 && method !== 8) throw new SourceError(`${path} in ${label} uses a compression the plugin does not read (method ${method}).`);
    if (packed === 0xffffffff || size === 0xffffffff) throw new SourceError(`${label} uses Zip64, which the plugin does not read.`);
    if (size > MAX_ENTRY_BYTES) throw new SourceError(`${path} is larger than ${MAX_ENTRY_BYTES / 1024 / 1024} MB, so it is not generator data.`);
    if (local + 30 > bytes.length || view.getUint32(local, true) !== 0x04034b50) throw broken();
    const start = local + 30 + view.getUint16(local + 26, true) + view.getUint16(local + 28, true);
    if (start + packed > bytes.length) throw broken();
    const stored = bytes.subarray(start, start + packed);
    const data = method === 0 ? stored : await inflate(stored, MAX_ENTRY_BYTES, path);
    if (data.length !== size) throw new SourceError(`${path} in ${label} is damaged: it is ${data.length} bytes, not the ${size} the zip says.`);
    found.push({ path, text: textOf(data, path) });
  }
  return found;
}

/**
 * The text of every file the plugin reads, from the files a person added.
 *
 * @param {Array<{ name: string, bytes: Uint8Array }>} files  Each file the person chose or dropped.
 * @returns {Promise<Array<{ path: string, text: string }>>}
 * @throws {SourceError} for a zip that cannot be read, and for a loose file the generator does not write.
 */
async function readSources(files) {
  if (!Array.isArray(files) || files.length === 0) throw new SourceError("Add the artifact .zip, or manifest.json with the figma-001.json files.");
  const sources = [];
  for (const file of files) {
    if (file.bytes.length > MAX_ZIP_BYTES) throw new SourceError(`${file.name} is larger than ${MAX_ZIP_BYTES / 1024 / 1024} MB.`);
    if (looksLikeZip(file.bytes)) {
      sources.push(...(await readZip(file.bytes, file.name)));
    } else if (WANTED.test(file.name)) {
      if (file.bytes.length > MAX_ENTRY_BYTES) throw new SourceError(`${file.name} is larger than ${MAX_ENTRY_BYTES / 1024 / 1024} MB, so it is not generator data.`);
      sources.push({ path: file.name, text: textOf(file.bytes, file.name) });
    } else if (!SKIPPED_LOOSE.test(file.name)) {
      throw new SourceError(`${file.name} is not a file the generator writes. Add the artifact .zip, or manifest.json with the figma-001.json files.`);
    }
  }
  const seen = new Set();
  for (const { path } of sources) {
    if (seen.has(path)) throw new SourceError(`${path} was added twice.`);
    seen.add(path);
  }
  return sources;
}

const $ = (id) => document.getElementById(id);
let summary = null;

function send(message) {
  parent.postMessage({ pluginMessage: message }, "*");
}

function show(id, visible) {
  $(id).hidden = !visible;
}

function problem(text) {
  $("problem").textContent = text;
  show("problem", true);
  show("working", false);
}

function reset() {
  show("problem", false);
  show("release", false);
  show("results", false);
  summary = null;
}

function item(parent, status, text, detail, bad) {
  const li = document.createElement("li");
  const label = document.createElement("span");
  label.className = bad ? "status failed-status" : "status";
  label.textContent = status;
  li.append(label, document.createTextNode(text));
  if (detail) {
    const more = document.createElement("span");
    more.className = "detail";
    more.textContent = detail;
    li.append(more);
  }
  parent.append(li);
}

async function take(list) {
  reset();
  $("working").textContent = "Reading the files.";
  show("working", true);
  try {
    const files = [];
    for (const file of list) files.push({ name: file.name, bytes: new Uint8Array(await file.arrayBuffer()) });
    send({ type: "load", sources: await readSources(files) });
  } catch (error) {
    problem(error.message);
  }
}

function showRelease(found) {
  summary = found;
  show("working", false);
  $("targets").textContent = "Release " + (found.release || "(unnamed)") + " writes to the variable collection “" + found.collection + "” and these pages: " + found.pages.join(", ") + ".";
  $("units").replaceChildren();
  for (const unit of found.units) item($("units"), unit.kind, unit.label, unit.variants ? unit.variants + " variants" : "");
  const notes = [];
  if (found.notApplied.screenshots > 0) notes.push(found.notApplied.screenshots + " screenshot(s) in this release are not applied here; the relay uploads them.");
  if (found.notApplied.retention) notes.push("The screen retention file is not applied here either.");
  $("notes").textContent = notes.join(" ");
  $("apply").disabled = false;
  show("release", true);
}

function showResult(result) {
  const labels = new Map(summary.units.map((unit) => [unit.id, unit.label]));
  show("working", false);
  show("release", false);
  const counts = { written: 0, exists: 0, failed: 0 };
  $("outcomes").replaceChildren();
  for (const unit of result.units) {
    counts[unit.status] = (counts[unit.status] || 0) + 1;
    const label = labels.get(unit.id) || unit.name || unit.id;
    if (unit.status === "failed") item($("outcomes"), "failed", label, unit.error, true);
    else if (unit.status === "exists") item($("outcomes"), "exists", label, "Already in the file, so it was left alone.");
    else {
      const parts = [];
      if (unit.variants > 1) parts.push(unit.variants + " variants");
      if (unit.movedToOlder && unit.movedToOlder.length > 0) parts.push("moved " + unit.movedToOlder.join(", ") + " to Older versions");
      if (unit.removed && unit.removed.length > 0) parts.push("removed " + unit.removed.join(", "));
      item($("outcomes"), "written", label, parts.join("; "));
    }
  }
  $("tally").textContent = counts.written + " written, " + counts.exists + " already there, " + counts.failed + " failed.";
  const tokens = result.tokens;
  $("variables").textContent = tokens.error ? "Variables could not be written: " + tokens.error : "Variables: " + tokens.made.length + " made, " + tokens.updated.length + " changed.";
  $("warnings").replaceChildren();
  for (const warning of result.warnings) item($("warnings"), "note", warning);
  show("results", true);
}

window.onmessage = (event) => {
  const message = event.data && event.data.pluginMessage;
  if (!message) return;
  if (message.type === "loaded") showRelease(message.summary);
  else if (message.type === "applying") {
    $("apply").disabled = true;
    $("working").textContent = "Applying. A large release can take a few minutes; keep this window open.";
    show("working", true);
  } else if (message.type === "applied") showResult(message.result);
  else if (message.type === "refused") {
    $("apply").disabled = false;
    problem("Nothing was applied. " + message.message);
  } else if (message.type === "failed") {
    $("apply").disabled = false;
    problem("Figma stopped the run: " + message.message + " Some units may already be in the file. Run again to see which.");
  }
};

$("files").addEventListener("change", (event) => {
  take(event.target.files);
  event.target.value = "";
});
$("apply").addEventListener("click", () => {
  show("problem", false);
  send({ type: "apply" });
});
const drop = $("drop");
drop.addEventListener("dragover", (event) => {
  event.preventDefault();
  drop.classList.add("over");
});
drop.addEventListener("dragleave", () => drop.classList.remove("over"));
drop.addEventListener("drop", (event) => {
  event.preventDefault();
  drop.classList.remove("over");
  take(event.dataTransfer.files);
});
</script>
</body>
</html>
